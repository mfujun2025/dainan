name: Auto-update sitemap

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sitemap.xml'          # 避免 sitemap 更新本身再次触发，形成死循环

permissions:
  contents: write              # 允许工作流提交回 main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 拿全历史，确保能正常 push

      - name: Generate sitemap
        run: python scripts/build_sitemap.py

      - name: Commit if changed
        run: |
          if ! git diff --quiet sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: auto-update sitemap [skip ci]"
            git push origin main
            echo "sitemap updated"
          else
            echo "no sitemap change"
          fi
